[project]
name = "interop"
version = "0.1.0"
description = "Agent Compatibility Gateway — protocol translation, tool-call normalization, and capability certification for local LLM coding agents."
requires-python = ">=3.11"
authors = [
    { name = "John London" },
]
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-extra-types>=2.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.9",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
interop = "interop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]