[project]
name = "agent-interop"
version = "0.1.0"
description = "Agent Compatibility Gateway — protocol translation, tool-call normalization, and capability conformance testing for local LLM coding agents."
requires-python = ">=3.11"
authors = [
    { name = "John London" },
]
license = { text = "MIT" }
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    # MVP scope is Linux (see README) — the managed launcher and installer
    # rely on POSIX-only behavior (os.access(X_OK), process groups/signals,
    # a shell shim script), so "OS Independent" overclaimed portability
    # that was never tested.
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: Proxy Servers",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.22",
    "pydantic>=2.0",
    "pydantic-extra-types>=2.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "asgi-lifespan>=2.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.22",
]
# No "cli"/"server" extras: typer/rich (CLI) and fastapi/uvicorn (server)
# are unconditional base dependencies above, not optional — there was
# nothing left for an empty extra to gate.

[project.scripts]
interop = "agent_interop.cli:app"

[project.entry-points."agent_interop.backends"]

[project.entry-points."agent_interop.agents"]

[project.entry-points."agent_interop.tool_selectors"]

[project.entry-points."agent_interop.controllers"]

[project.entry-points."agent_interop.tokenizers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_interop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",   # Blind except Exception — idiomatic in many cases
    "RUF012",   # Mutable class defaults — common pattern with dataclasses
    "SIM102",   # Collapsible if — style preference, not a bug
    "S110",     # try-except-pass — valid for cleanup operations
    "SIM117",   # Multiple with statements — style preference
    "TRY004",   # Type check without TypeError — intentional in some cases
    "PLW0602",  # global variable not assigned — valid pattern for module state
    "PLW1510",  # subprocess without check — handled elsewhere
    "B008",     # Function call in default argument — intentional for typer
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
