schema_version: interop.model-profile.v2
id: llama-3x-instruct
match:
  model_patterns:
    - '^llama-3\.[13]'
  backends:
    - ollama
    - openai_compatible
tool_calling:
  presentation:
    mode: prompted
  extraction:
    # Was `parser: llama` (LlamaExtractor, which matches a
    # `<|python_tag|>` prefix — Llama's own native special token) while
    # the rendered contract taught <tool_call>...</tool_call> — a real,
    # previously-invisible mismatch. Switched to the extractor that
    # actually matches what's taught; not empirically re-validated
    # against this specific model, but the mismatch it replaces was
    # definitely broken.
    parser: tool_call_envelope
    envelope: tool_call
  choice:
    automatic: true
    required: true
    named: true
    parallel: false
context:
  declared_tokens: 131072
  safe_tokens: 65536
streaming:
  supported: true
