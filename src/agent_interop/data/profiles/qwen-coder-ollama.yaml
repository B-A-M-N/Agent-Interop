schema_version: interop.model-profile.v2
id: qwen-coder-ollama
match:
  model_patterns:
    - "^qwen.*coder"
  backends:
    - ollama
tool_calling:
  presentation:
    mode: native
  extraction:
    parser: qwen
    envelope: tool
    fallbacks:
      - parser: whole_message_json
        skip_when_native_present: true
  choice:
    automatic: true
    required: true
    named: true
    parallel: false
reasoning:
  supported: true
context:
  declared_tokens: 131072
  safe_tokens: 65536
streaming:
  supported: true
