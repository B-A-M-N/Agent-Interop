schema_version: interop.model-profile.v1
id: qwen-coder-ollama
match:
  model_patterns:
    - "^qwen.*coder"
  backends:
    - ollama
template:
  source: backend
  fallback: qwen-tool-v1
tool_calling:
  supported: true
  parser: qwen
  automatic: true
  required: true
  named: true
  parallel: false
  strict_arguments: preferred
reasoning:
  supported: true
  parser: qwen-reasoning
  send_to_client: summary
context:
  declared_tokens: 131072
  safe_tokens: 65536
  reserve_output_tokens: 8192
streaming:
  supported: true
  tool_arguments_incremental: true
repair:
  malformed_json: constrained_regeneration
  unknown_tool: reject
  missing_tool_id: synthesize
  max_attempts: 1