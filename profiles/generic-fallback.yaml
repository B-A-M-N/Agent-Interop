schema_version: interop.model-profile.v1
id: generic-fallback
match:
  model_patterns:
    - ".*"
  backends:
    - ollama
    - openai-compatible
template:
  source: backend
tool_calling:
  supported: false
  parser: generic
  automatic: false
  required: true
  named: false
  parallel: false
  strict_arguments: false
reasoning:
  supported: false
context:
  declared_tokens: 4096
  safe_tokens: 2048
  reserve_output_tokens: 1024
streaming:
  supported: true
  tool_arguments_incremental: false
repair:
  malformed_json: reparse
  unknown_tool: reject
  missing_tool_id: synthesize
  max_attempts: 1